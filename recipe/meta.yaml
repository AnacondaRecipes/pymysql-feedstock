{% set name = "pymysql" %}
{% set version = "1.2.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 6c7b17ca686988104d7426c27895b455cdeea3e9d3ceb1270f0c3704fead8c33

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<39]

requirements:
  host:
    - python
    - pip
    - setuptools >=77
  run:
    - python
  run_constrained:
  # rsa:
    - cryptography >=46.0.7
  # ed25519:
    - pynacl >=1.4.0

# Pytest skipped. Needs Docker to setup the environment before the test.
# https://github.com/PyMySQL/PyMySQL/blob/v1.1.1/.github/workflows/test.yaml#L97
test:
  imports:
    - pymysql
    - pymysql.constants
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/PyMySQL/PyMySQL
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Pure Python MySQL Driver
  description: |
    This package contains a pure-Python MySQL client library. The goal of
    PyMySQL is to be a drop-in replacement for MySQLdb and work on CPython,
    PyPy and IronPython.
  doc_url: https://pymysql.readthedocs.io/
  dev_url: https://github.com/PyMySQL/PyMySQL

extra:
  recipe-maintainers:
    - dougalsutherland
